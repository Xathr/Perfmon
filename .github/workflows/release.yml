name: release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable && rustup target add wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-wasip2

      - name: Test
        run: cargo test --release

      - name: Build perfmon.wasm
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: perfmon
          path: target/wasm32-wasip2/release/perfmon.wasm
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd target/wasm32-wasip2/release && sha256sum perfmon.wasm > perfmon.wasm.sha256 && cd -
          gh release create "$GITHUB_REF_NAME" target/wasm32-wasip2/release/perfmon.wasm target/wasm32-wasip2/release/perfmon.wasm.sha256 \
            --title "perfmon $GITHUB_REF_NAME" \
            --notes "Drop \`perfmon.wasm\` into your Pumpkin server's \`plugins/\` folder and restart. See the README for commands and config."

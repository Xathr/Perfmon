[package]
name = "perfmon"
version = "0.3.2"
edition = "2024"
license = "GPL-3.0"
description = "Pumpkin plugin: tick timing, lag spikes, entity counts and memory, with in-game commands and a CSV log"
authors = ["Xathr"]
publish = false

[lib]
# Capitalised so the build produces Perfmon.wasm.
name = "Perfmon"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned to the same Pumpkin commit as build.sh
pumpkin-plugin-api = { git = "https://github.com/Pumpkin-MC/Pumpkin.git", rev = "eda69440e6369c5f8a05c3f69fc809c40dab93a6" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
serde_json = "1"
ed25519-dalek = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# wasi:http, for the update check
wasi = "0.14"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
